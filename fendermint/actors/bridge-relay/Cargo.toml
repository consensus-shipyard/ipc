[package]
name = "fendermint_actor_bridge_relay"
description = "IPC bridge relay actor: relays TokensLocked events from Filecoin to Ethereum"
license.workspace = true
edition.workspace = true
authors.workspace = true
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
fil_actors_runtime = { workspace = true, optional = true, features = ["fil-actor"] }
fvm_shared = { workspace = true }
fvm_ipld_encoding = { workspace = true }
fvm_ipld_blockstore = { workspace = true }
fvm_ipld_hamt = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_tuple = { workspace = true }
frc42_dispatch = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
hex = "0.4"
cid = { workspace = true, default-features = false }

[dev-dependencies]
fvm_ipld_blockstore = { workspace = true }

[features]
default = []
fil-actor = ["fil_actors_runtime"]
