[package]
name = "actors-umbrella"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Depend on all individual actors to be included."

# we use the list of dependencies
# to determine which ones to include in the `.car` file
# and filter for the `fendermint_actor_` prefix
# the all-in-one wasmblob is NOT used, nor should it be compiled,
# neither for the host nor target arch
[target.'cfg(target_arch = "wasm32")'.dependencies]
fendermint_actor_activity_tracker = { path = "activity-tracker", features = ["fil-actor"] }
fendermint_actor_chainmetadata = { path = "chainmetadata", features = ["fil-actor"] }
fendermint_actor_f3_light_client = { path = "f3-light-client", features = ["fil-actor"] }
fendermint_actor_gas_market_eip1559 = { path = "gas_market/eip1559", features = ["fil-actor"] }
fendermint_actor_eam = { path = "eam", features = ["fil-actor"] }
# Storage node actors
fendermint_actor_storage_adm = { path = "storage_adm", features = ["fil-actor"] }
fendermint_actor_storage_blobs = { path = "storage_blobs", features = ["fil-actor"] }
fendermint_actor_storage_blob_reader = { path = "storage_blob_reader", features = ["fil-actor"] }
fendermint_actor_storage_bucket = { path = "storage_bucket", features = ["fil-actor"] }
fendermint_actor_machine = { path = "machine", features = ["fil-actor"] }
fendermint_actor_storage_config = { path = "storage_config", features = ["fil-actor"] }
fendermint_actor_storage_timehub = { path = "storage_timehub", features = ["fil-actor"] }
