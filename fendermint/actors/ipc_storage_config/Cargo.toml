[package]
name = "fendermint_actor_ipc_storage_config"
description = "Singleton actor for updateable ipc storage network parameters"
license.workspace = true
edition.workspace = true
authors.workspace = true
version = "0.1.0"

[lib]
## lib is necessary for integration tests
## cdylib is necessary for Wasm build
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = { workspace = true }
fendermint_actor_blobs_shared = { path = "../blobs/shared" }
fil_actors_runtime = { workspace = true }
fvm_ipld_encoding = { workspace = true }
fvm_shared = { workspace = true }
num-traits = { workspace = true }
ipc_storage_sol_facade = { workspace = true, features = ["config"] }
serde = { workspace = true, features = ["derive"] }

fendermint_actor_ipc_storage_config_shared = { path = "../ipc_storage_config/shared" }
ipc_storage_actor_sdk = { path = "../../../ipc-storage/actor_sdk" }

[dev-dependencies]
fil_actors_evm_shared = { workspace = true }
fil_actors_runtime = { workspace = true, features = ["test_utils"] }
hex-literal = { workspace = true }

[features]
fil-actor = ["fil_actors_runtime/fil-actor"]
