[package]
name = "storage-services"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true

# HTTP server dependencies
warp.workspace = true
hex.workspace = true

# HTTP client dependencies
reqwest = { version = "0.11", features = ["json"] }

# CLI dependencies
clap = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Iroh dependencies for decentralized storage
iroh.workspace = true
iroh-base.workspace = true
iroh-blobs.workspace = true
storage_node_iroh_manager = { path = "../storage-node/iroh_manager" }

# Fendermint dependencies for RPC client
fendermint_rpc = { path = "../fendermint/rpc" }
fendermint_vm_message = { path = "../fendermint/vm/message" }
fendermint_vm_actor_interface = { path = "../fendermint/vm/actor_interface" }
fendermint_actor_storage_blobs_shared = { path = "../fendermint/actors/storage_blobs/shared" }
fendermint_actor_storage_bucket = { path = "../fendermint/actors/storage_bucket" }
fendermint_crypto = { path = "../fendermint/crypto" }

# IPC dependencies for address parsing
ipc-api = { path = "../ipc/api" }
ethers.workspace = true

# FVM dependencies
fvm_shared.workspace = true
fvm_ipld_encoding.workspace = true

# Tendermint
tendermint-rpc.workspace = true

# BLS signatures
bls-signatures = { version = "0.13.1", default-features = false, features = ["blst"] }
blake2b_simd.workspace = true
rand = "0.8"

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "node"
path = "src/bin/node.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
